# Hosted profile (Render + Neon Postgres). All secrets come from environment variables, never from this file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
# Free Postgres tiers allow few connections; one rider needs very few.
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
server.port=${PORT:8080}
app.api-key=${API_KEY}
app.require-api-key=true
app.allowed-origins=${ALLOWED_ORIGINS}
