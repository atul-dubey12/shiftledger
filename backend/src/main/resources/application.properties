spring.application.name=shiftledger-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/shiftledger;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always
# Local dev uses H2 + ddl-auto; Flyway migrations only run in the prod profile (Postgres).
spring.flyway.enabled=false
# No key locally. In prod, every /api request (except /api/health) must send X-Api-Key.
app.api-key=
app.allowed-origins=http://localhost:4200
